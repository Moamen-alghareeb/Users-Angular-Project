<div class="card text-center bg-success-subtle mx-auto my-3 w-25">
  <div class="card-header border-success">
    <h4 class="card-title">User data</h4>
  </div>
  <div class="card-body">
    <ul class="list-group list-group-flush">
      <li class="list-group-item bg-success-subtle border-success-subtle">
        Name : {{ User["name"] }}
      </li>
      <li class="list-group-item bg-success-subtle border-success-subtle">
        Email: {{ User["email"] }}
      </li>
    </ul>
  </div>
  <div class="card-body border-top border-success">
    <a routerLink="/users/{{ User.id }}" class="btn btn-outline-success"
      >User's Details</a
    >
    <!-- delete button -->
    <span class="btn btn-outline-success mx-2" (click)="delete()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        width="25px"
      >
        <path
          fill-rule="evenodd"
          d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z"
          clip-rule="evenodd"
        />
      </svg>
    </span>
    <!-- edit button -->
    <!-- Button trigger modal -->
    <button
      type="button"
      class="btn btn-outline-success"
      data-bs-toggle="modal"
      [attr.data-bs-target]="'#editModal-' + User.id"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        width="25px"
      >
        <path
          d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712ZM19.513 8.199l-3.712-3.712-12.15 12.15a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32L19.513 8.2Z"
        />
      </svg>
    </button>

    <!-- Modal -->
    <div
      class="modal fade"
      [id]="'editModal-' + User.id"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Edit {{ User.name }} Data
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <fieldset
            class="fieldset modal-body w-xs bg-base-200 border border-base-300 p-4 rounded-box mx-auto"
          >
            <form [formGroup]="MyFormData">
              <div class="input-group">
                <span class="input-group-text">Name</span>
                <input
                  formControlName="name"
                  type="text"
                  class="input my-1"
                  placeholder=" Enter Name"
                />
              </div>

              <div class="input-group">
                <span class="input-group-text">Username</span>
                <input
                  formControlName="username"
                  type="text"
                  class="input my-1"
                  placeholder="Enter username"
                />
              </div>

              <div class="input-group">
                <span class="input-group-text">Email</span>
                <input
                  formControlName="email"
                  type="email"
                  class="input my-1"
                  placeholder="Enter email"
                />
              </div>
            </form>
          </fieldset>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary" (click)="edit()">
              Save changes
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
